<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <title>MIVIUS MUSIC ARCHIVE // BEFORE THE STORY</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      color: #14a014;
      font-family: 'DotGothic16', monospace;
    }
    .archive {
      width: min(100%, 620px);
      padding: 17px;
      border: 2px solid #14a014;
      background: #000;
      box-shadow: 0 0 18px rgba(30, 224, 30, .12), inset 0 0 18px rgba(20, 160, 20, .06);
    }
    .eyebrow {
      margin-bottom: 8px;
      color: #0b5e0b;
      font-size: 11px;
      letter-spacing: 2px;
    }
    h1 {
      margin: 0 0 6px;
      color: #1ee01e;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 400;
      letter-spacing: 2px;
    }
    .subtitle {
      margin: 0 0 16px;
      color: #0b5e0b;
      font-size: 11px;
      letter-spacing: 1px;
    }
    audio {
      display: block;
      width: 100%;
      min-height: 42px;
      color-scheme: dark;
    }
    .scanline {
      height: 1px;
      margin-top: 14px;
      background: linear-gradient(90deg, transparent, #14a014, transparent);
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      color: #0b5e0b;
      font-size: 10px;
      letter-spacing: 1px;
    }
    .heart { color: #ff2020; }
    @media (max-width: 420px) {
      .archive { padding: 13px; }
      .status { font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="archive">
    <div class="eyebrow">MIVIUS MUSIC ARCHIVE // AUDIO FILE 002</div>
    <h1>♫ BEFORE THE STORY</h1>
    <p class="subtitle">PERSONAL PROFILE AUDIO // TRACK 002</p>

    <audio id="mivius-audio" controls loop preload="metadata" playsinline>
      <source src="https://cdn.jsdelivr.net/gh/miviusamerica-beep/-@main/Before%20the%20Story.mp3" type="audio/mpeg">
      <source src="https://raw.githubusercontent.com/miviusamerica-beep/-/refs/heads/main/Before%20the%20Story.mp3" type="audio/mpeg">
      Your browser does not support HTML audio.
    </audio>

    <div class="scanline"></div>
    <div class="status" aria-live="polite">
      <span><span class="heart">♥</span> MIVIUS SYSTEM</span>
      <span id="mivius-status">STATUS: READY</span>
    </div>
  </main>

  <script>
    (() => {
      const audio = document.getElementById('mivius-audio');
      const status = document.getElementById('mivius-status');
      if (!audio || !status) return;
      audio.addEventListener('playing', () => { status.textContent = 'STATUS: PLAYING'; });
      audio.addEventListener('pause', () => { status.textContent = 'STATUS: PAUSED'; });
      audio.addEventListener('ended', () => { status.textContent = 'STATUS: READY'; });
      audio.addEventListener('error', () => { status.textContent = 'STATUS: FILE ERROR'; });
    })();
  </script>
</body>
</html>
